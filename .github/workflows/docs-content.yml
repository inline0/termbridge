name: Docs content

on:
  push:
    branches: [main, "docs/**"]
    paths:
      - "docs/**"
      - "scripts/check-docs-content.mjs"
      - ".github/workflows/docs-content.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs-content.mjs"
      - ".github/workflows/docs-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check portable documentation
        run: node scripts/check-docs-content.mjs --root docs --expected-docs 16 --expected-nav 3
